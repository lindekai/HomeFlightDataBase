# Stack auf dem NAS. Start: docker compose --env-file .env up -d --build (im Ordner nas/)
name: flightdb

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_INGEST_PASSWORD: ${DB_INGEST_PASSWORD}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      DB_ANALYSIS_PASSWORD: ${DB_ANALYSIS_PASSWORD}
      TZ: UTC
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_LAN_PORT:-5433}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  ingest:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      INGEST_ADMIN_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}
      INGEST_DB_DSN: postgresql://flightdb_ingest:${DB_INGEST_PASSWORD}@postgis:5432/${POSTGRES_DB}
      RECEIVER_HOST: ${RECEIVER_HOST}
      RECEIVER_SSH_USER: ${RECEIVER_SSH_USER}
      INGEST_SSH_KEY_READ: /ssh/ingest_read
      INGEST_SSH_KEY_ACK: /ssh/ingest_ack
      INGEST_INTERVAL_S: ${INGEST_INTERVAL_S:-300}
      FLIGHTDB_ENV: production
    volumes:
      - ${RAW_ARCHIVE_DIR}:/archive
      - ${INGEST_WORK_DIR}:/work
      - ${INGEST_SSH_DIR}:/ssh:ro
    logging: *logging

  analysis:
    build:
      context: ..
      dockerfile: analysis/Dockerfile
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      ANALYSIS_DB_DSN: postgresql://flightdb_analysis:${DB_ANALYSIS_PASSWORD}@postgis:5432/${POSTGRES_DB}
      ANALYSIS_INTERVAL_S: ${ANALYSIS_INTERVAL_S:-300}
      ANALYSIS_BER_LAT: ${ANALYSIS_BER_LAT}
      ANALYSIS_BER_LON: ${ANALYSIS_BER_LON}
      # Standardwerte wie in analysis/config.py (docs/analysis.md, Abschnitt Parameter).
      ANALYSIS_SETTLE_S: ${ANALYSIS_SETTLE_S:-120}
      ANALYSIS_FLIGHT_GAP_S: ${ANALYSIS_FLIGHT_GAP_S:-600}
      ANALYSIS_MAX_SPEED_KT: ${ANALYSIS_MAX_SPEED_KT:-800}
      ANALYSIS_CONTEXT_S: ${ANALYSIS_CONTEXT_S:-120}
      ANALYSIS_MIN_POSITIONS: ${ANALYSIS_MIN_POSITIONS:-5}
      ANALYSIS_VRATE_FPM: ${ANALYSIS_VRATE_FPM:-300}
      ANALYSIS_BER_RADIUS_M: ${ANALYSIS_BER_RADIUS_M:-40000}
      ANALYSIS_DEFAULT_RELEVANCE_FT: ${ANALYSIS_DEFAULT_RELEVANCE_FT:-10000}
      ANALYSIS_MAX_LAG_S: ${ANALYSIS_MAX_LAG_S:-10800}
      # Flugroutenvergleich (docs/routes.md)
      ANALYSIS_ROLE_NEAR_M: ${ANALYSIS_ROLE_NEAR_M:-10000}
      ANALYSIS_ROLE_MAX_ALT_FT: ${ANALYSIS_ROLE_MAX_ALT_FT:-3000}
      ANALYSIS_DIRECTION_DIST_M: ${ANALYSIS_DIRECTION_DIST_M:-15000}
      ANALYSIS_DIRECTION_TOL_DEG: ${ANALYSIS_DIRECTION_TOL_DEG:-30}
      ANALYSIS_DIRECTION_MIN_FLIGHTS: ${ANALYSIS_DIRECTION_MIN_FLIGHTS:-3}
      ANALYSIS_DIRECTION_MIN_SHARE: ${ANALYSIS_DIRECTION_MIN_SHARE:-0.8}
      ANALYSIS_ASSIGN_RATIO: ${ANALYSIS_ASSIGN_RATIO:-2.0}
      ANALYSIS_ROUTE_MAX_ALT_FT: ${ANALYSIS_ROUTE_MAX_ALT_FT:-}  # leer: keine Höhengrenze
      ANALYSIS_CORRIDOR_M: ${ANALYSIS_CORRIDOR_M:-1852}
      ANALYSIS_CORRIDOR_MIN_S: ${ANALYSIS_CORRIDOR_MIN_S:-30}
      ANALYSIS_APPROACH_TOL_M: ${ANALYSIS_APPROACH_TOL_M:-}  # leer: wie ANALYSIS_CORRIDOR_M
      ANALYSIS_REVIEW_MAX_GAP_S: ${ANALYSIS_REVIEW_MAX_GAP_S:-30}
      ANALYSIS_ZONES_FILE: /zones/geofences.geojson
      ANALYSIS_PROCEDURES_FILE: /zones/procedures.yaml
    volumes:
      # Verzeichnis statt Datei: fehlt die Datei, legt Docker sonst einen leeren Ordner an.
      - ${ZONES_DIR:-../config/local}:/zones:ro
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Berlin
      POSTGRES_DB: ${POSTGRES_DB}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
    volumes:
      - ${GRAFANA_DATA_DIR}:/var/lib/grafana
      - ../dashboard/provisioning:/etc/grafana/provisioning:ro
      - ../dashboard/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_LAN_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup/backup.sh"]
    environment:
      PGHOST: postgis
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: Europe/Berlin
    volumes:
      - ../database/backup:/backup:ro
      - ${DB_BACKUP_DIR}:/dumps
    logging: *logging
