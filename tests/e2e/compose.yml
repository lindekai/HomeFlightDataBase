name: flightdb-e2e

services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: flightdb
      POSTGRES_USER: flightdb_admin
      POSTGRES_PASSWORD: admin
      DB_INGEST_PASSWORD: ingest
      DB_READONLY_PASSWORD: reader
      DB_ANALYSIS_PASSWORD: analysis
    volumes:
      - ../../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightdb_admin -d flightdb"]
      interval: 2s
      retries: 60

  fake-readsb:
    image: python:3.12-slim
    working_dir: /fixtures
    command: ["python", "-m", "synthetic.serve"]
    volumes:
      - ../fixtures:/fixtures:ro

  receiver-ssh:
    build: ./receiver-ssh
    volumes:
      - receiver-data:/data
      - keys:/keys

  recorder:
    build: ../../receiver/recorder
    user: "1000:1000"
    depends_on:
      receiver-ssh:
        condition: service_healthy
      fake-readsb:
        condition: service_started
    environment:
      RECEIVER_ID: TEST
      READSB_URL: http://fake-readsb/data/aircraft.json
      RECORDER_DATA_DIR: /data
      RECORDER_ROTATE_SECONDS: "10"
      RECORDER_SYNTHETIC: "1"
      RECORDER_NTP_SERVER: 127.0.0.1
    volumes:
      - receiver-data:/data

  ingest:
    build:
      context: ../..
      dockerfile: ingest/Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
      receiver-ssh:
        condition: service_healthy
    environment:
      INGEST_ADMIN_DSN: postgresql://flightdb_admin:admin@postgis:5432/flightdb
      INGEST_DB_DSN: postgresql://flightdb_ingest:ingest@postgis:5432/flightdb
      RECEIVER_HOST: receiver-ssh
      RECEIVER_SSH_USER: flightdb-sync
      INGEST_SSH_KEY_READ: /keys/ingest_read
      INGEST_SSH_KEY_ACK: /keys/ingest_ack
      INGEST_INTERVAL_S: "5"
      FLIGHTDB_ENV: test
    volumes:
      - keys:/keys:ro

  analysis:
    build:
      context: ../..
      dockerfile: analysis/Dockerfile
    depends_on:
      ingest:
        condition: service_started
    environment:
      ANALYSIS_DB_DSN: postgresql://flightdb_analysis:analysis@postgis:5432/flightdb
      ANALYSIS_INTERVAL_S: "5"
      ANALYSIS_SETTLE_S: "5"
      # Erfundener Flughafen aus tests/fixtures/procedures.test.yaml
      ANALYSIS_BER_LAT: "50.0"
      ANALYSIS_BER_LON: "10.0"
      ANALYSIS_BER_RADIUS_M: "25000"
      ANALYSIS_ZONES_FILE: /zones/zones.example.geojson
      ANALYSIS_PROCEDURES_FILE: /zones/procedures.test.yaml
    volumes:
      - ./zones.example.geojson:/zones/zones.example.geojson:ro
      - ../fixtures/procedures.test.yaml:/zones/procedures.test.yaml:ro

  grafana:
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      POSTGRES_DB: flightdb
      DB_READONLY_PASSWORD: reader
    volumes:
      - ../../dashboard/provisioning:/etc/grafana/provisioning:ro
      - ../../dashboard/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3002:3000"

volumes:
  receiver-data:
  keys:
